<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .active-dot {
      width: 24px;
      height: 8px;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface flex flex-col min-h-screen items-center justify-center p-container-margin">
<!-- Header Branding (Hidden navigation as per Onboarding rule) -->
<header class="fixed top-0 w-full h-16 flex items-center justify-center px-container-margin">
<h1 class="font-display-lg text-headline-lg font-extrabold text-primary tracking-tighter">FastPass</h1>
</header>
<main class="flex-1 flex flex-col items-center justify-center w-full max-w-md">
<!-- Hero Illustration Section -->
<div class="relative w-full aspect-square flex items-center justify-center mb-xl">
<div class="absolute inset-0 bg-surface-container rounded-full scale-90 blur-3xl opacity-50"></div>
<!-- Premium Illustration with High-Clarity Layout -->
<div class="relative z-10 w-4/5 h-4/5 bg-gradient-to-br from-primary to-primary-container rounded-[2.5rem] shadow-2xl flex flex-col items-center justify-center p-lg transform -rotate-3 overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16 blur-xl"></div>
<div class="absolute bottom-0 left-0 w-24 h-24 bg-black/5 rounded-full -ml-8 -mb-8 blur-lg"></div>
<div class="bg-white/95 p-md rounded-2xl shadow-lg transform rotate-6 mb-sm">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">redeem</span>
</div>
<div class="mt-md text-center">
<div class="text-on-primary-container font-headline-md text-headline-md opacity-90">UNLOCKED</div>
<div class="text-on-primary-container/70 font-label-sm text-label-sm tracking-widest mt-xs">PREMIUM TIER</div>
</div>
<!-- Floaties -->
<div class="absolute top-10 left-10 w-4 h-4 bg-tertiary rounded-full animate-bounce"></div>
<div class="absolute bottom-12 right-8 w-6 h-6 bg-surface-container-highest/20 rounded-lg transform rotate-45"></div>
</div>
<!-- Detail Card Overlay -->
<div class="absolute bottom-4 right-2 z-20 bg-white p-sm rounded-xl shadow-xl flex items-center gap-sm border border-outline-variant">
<div class="w-8 h-8 rounded-full bg-tertiary-fixed-dim flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary text-sm" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div class="pr-md">
<p class="font-label-sm text-label-sm text-on-surface">Free Bistro Entree</p>
<p class="text-[10px] font-body-md text-on-surface-variant opacity-60">Ready to redeem</p>
</div>
</div>
</div>
<!-- Content Section -->
<div class="text-center mb-xl">
<h2 class="font-headline-lg text-display-lg text-on-background mb-md leading-tight">Redeem Rewards</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">
        Turn your points into free meals, drinks, and exclusive deals
      </p>
</div>
<!-- Pagination Indicators -->
<div class="flex gap-2 mb-xl">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="active-dot rounded-full bg-primary transition-all duration-300"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
</main>
<!-- CTA Section -->
<footer class="w-full max-w-md space-y-md pb-xl">
<button class="w-full h-14 bg-gradient-to-r from-primary to-primary-container text-on-primary font-label-lg text-label-lg rounded-xl shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
      Get Started
      <span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="w-full text-center py-base">
<span class="font-body-md text-body-md text-on-surface-variant">I already have an account</span>
</button>
</footer>
