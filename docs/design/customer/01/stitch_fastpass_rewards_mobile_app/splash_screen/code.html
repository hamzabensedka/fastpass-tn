<div class="mb-lg p-xl bg-white/10 backdrop-blur-md rounded-3xl border border-white/20 shadow-2xl">

          Earn points. Eat more. Pay less.
        </h1>
<div class="flex items-center justify-center space-x-sm mt-md">
<span class="h-[2px] w-8 bg-white/30 rounded-full"></span>
<p class="font-label-lg text-label-lg text-white/80 uppercase tracking-[0.2em]">Premium Velocity</p>
<span class="h-[2px] w-8 bg-white/30 rounded-full"></span>
</div>
</div>
</div>
<!-- Loading Indicator / Progress -->
<div class="absolute bottom-xl left-1/2 -translate-x-1/2 w-full max-w-[200px] px-gutter">
<div class="h-1.5 w-full bg-white/20 rounded-full overflow-hidden">
<div class="h-full w-2/3 bg-white rounded-full shadow-[0_0_12px_rgba(255,255,255,0.5)]"></div>
</div>
<p class="mt-sm font-label-sm text-label-sm text-white/60 text-center">Initializing FastPass...</p>
</div>
<!-- Bottom Aesthetic Accents -->
<div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-black/20 to-transparent pointer-events-none"></div>
</main>
